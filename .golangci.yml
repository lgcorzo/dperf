linters-settings:
  misspell:
    locale: US

linters:
  disable-all: true
  enable:
    - typecheck
    - goimports
    - misspell
    - govet
    - revive
    - ineffassign
    - gosimple
    - gomodguard
    - gofmt
    - unused
    - unconvert
    - gocritic

issues:
  exclude-use-default: false
  exclude:
    - should have a package comment
    - error strings should not be capitalized or end with punctuation or a newline
    - "singleCaseSwitch: should rewrite switch statement to if statement"
    - "unlambda: replace"
    - "captLocal:"
    - "ifElseChain:"
    - "elseif:"
