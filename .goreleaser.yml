project_name: dperf

release:
  name_template: "Release version {{.Version}}"

  github:
    owner: lgcorzo
    name: dperf

before:
  hooks:
    - go mod tidy

builds:
  -
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - --tags=kqueue
    ldflags:
      - "-s -w -X github.com/lgcorzo/dperf/cmd.Version={{.Version}}"

archives:
  -
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format: binary

nfpms:
  -
    vendor: Sovereign Ecosystem
    homepage: https://github.com/lgcorzo/dperf
    maintainer: Sovereign Ecosystem Maintenance <dev@lgcorzo.dev>
    description: Dperf is a drive performance measurement tool.
    license: GNU Affero General Public License v3.0
    formats:
      - deb
      - rpm

snapshot:
  name_template: v0.0.0@{{.ShortCommit}}

changelog:
  sort: asc

dockers:
- image_templates:
  - "quay.io/lgcorzo/dperf:{{ .Tag }}-amd64"
  use: buildx
  dockerfile: Dockerfile
  extra_files:
    - LICENSE
    - CREDITS
  build_flag_templates:
  - "--platform=linux/amd64"
- image_templates:
  - "quay.io/lgcorzo/dperf:{{ .Tag }}-ppc64le"
  use: buildx
  dockerfile: Dockerfile
  extra_files:
    - LICENSE
    - CREDITS
  build_flag_templates:
  - "--platform=linux/ppc64le"
- image_templates:
  - "quay.io/lgcorzo/dperf:{{ .Tag }}-s390x"
  use: buildx
  dockerfile: Dockerfile
  extra_files:
    - LICENSE
    - CREDITS
  build_flag_templates:
  - "--platform=linux/s390x"
- image_templates:
  - "quay.io/lgcorzo/dperf:{{ .Tag }}-arm64"
  use: buildx
  goarch: arm64
  dockerfile: Dockerfile
  extra_files:
    - LICENSE
    - CREDITS
  build_flag_templates:
  - "--platform=linux/arm64"
docker_manifests:
- name_template: quay.io/lgcorzo/dperf:{{ .Tag }}
  image_templates:
  - quay.io/lgcorzo/dperf:{{ .Tag }}-amd64
  - quay.io/lgcorzo/dperf:{{ .Tag }}-arm64
  - quay.io/lgcorzo/dperf:{{ .Tag }}-ppc64le
  - quay.io/lgcorzo/dperf:{{ .Tag }}-s390x
- name_template: quay.io/lgcorzo/dperf:latest
  image_templates:
  - quay.io/lgcorzo/dperf:{{ .Tag }}-amd64
  - quay.io/lgcorzo/dperf:{{ .Tag }}-arm64
  - quay.io/lgcorzo/dperf:{{ .Tag }}-ppc64le
  - quay.io/lgcorzo/dperf:{{ .Tag }}-s390x
